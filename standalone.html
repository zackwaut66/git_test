'use strict';
const ROOT=document.querySelector('#app');
const KEY='bell-beneath-ash-p01b';
const SLOTS=['Weapon','Head','Armor','Charm'];
const SETS={
  'Ashen Pilgrim':{two:'+4 ATK to equipped Hunters',four:'+12 starting Resolve'},

const HUNTER_BASE=[
  {id:'vanguard',name:'Vanguard',role:'Frontline',hp:170,atk:16,row:'front'},

];

  {name:'Forsaken Farmstead',short:'FARMSTEAD',kind:'farm',reward:{coin:28,iron:18,salvage:3},enemies:[['Carrion Scavenger',180,24,'front','feral'],['Ash Hound',145,25,'front','feral'],['Farmstead Lurker',155,22,'back','lurker']]},
  {name:'Hollow Causeway',short:'CAUSEWAY',kind:'causeway',reward:{coin:38,iron:17,salvage:7},enemies:[['Road Reaver',230,23,'front','reaver'],['Road Reaver',215,22,'front','reaver'],['Ashbound Rifleman',185,27,'back','rifleman'],['Bridge Spotter',150,18,'back','spotter']]},
  {name:'Saint Orra Chapel',short:'SAINT ORRA',kind:'chapel',reward:{coin:48,iron:19,salvage:9},enemies:[['Reliquary Husk',295,24,'front','husk'],['Reliquary Husk',265,23,'front','husk'],['Chapel Thrall',200,23,'front','thrall'],['Bell Hand',175,27,'back','bell']]},
  {name:'Penitent Warden',short:'WARDEN',kind:'warden',reward:{coin:90,iron:24,salvage:14},enemies:[['Penitent Warden',880,38,'front','warden'],['Bellbound Servitor',240,25,'front','servitor'],['Bellbound Servitor',240,25,'front','servitor']]}
];
const EVENTS=[
  [
    {title:'THE BURIED HOUSE',text:'A farmhouse roof cuts through the ash. A broken window opens into the buried rooms below.',risk:'SEARCH BELOW',safe:'MARK THE SITE',resource:'salvage'},
    {title:'THE CINDER WELL',text:'The old irrigation well is warm to the touch. Something metallic knocks against the stone far below.',risk:'LOWER A HUNTER',safe:'SEAL THE WELL',resource:'iron'},
    {title:'THE EMPTY TABLE',text:'A table has been set for six inside a roofless kitchen. The ash has fallen everywhere except the plates.',risk:'SEARCH THE HOUSE',safe:'KEEP MOVING',resource:'coin'}
  ],
  [
    {title:'THE HANGING BUS',text:'A transit carriage hangs over the collapsed road. A military case is visible behind the shattered glass.',risk:'CROSS INTO IT',safe:'TAKE THE LONG ROAD',resource:'iron'},
    {title:'THE TOLL KEEPER',text:'A body in road leathers still sits upright inside the toll booth. Its hand is closed around a ring of keys.',risk:'TAKE THE KEYS',safe:'LEAVE THE DEAD',resource:'coin'},
    {title:'THE SUNKEN CONVOY',text:'Three military carriers lie nose-down in the ash beneath the bridge. One rear hatch remains above the surface.',risk:'CLIMB DOWN',safe:'MARK THE WRECK',resource:'salvage'}
  ],
  [
    {title:'THE UNLIT SHRINE',text:'Three black candles stand untouched behind Saint Orra. A sealed reliquary rests beneath them.',risk:'BREAK THE SEAL',safe:'LEAVE IT CLOSED',resource:'coin'},
    {title:'THE CHOIR DOOR',text:'A narrow iron door behind the chapel hums with a voice too low to be a hymn. Fresh tool marks scar the lock.',risk:'FORCE IT OPEN',safe:'BAR THE DOOR',resource:'iron'},
    {title:'THE BONE CENSER',text:'A silver censer swings from a dead branch without wind. Black ash falls upward into its bowl.',risk:'CUT IT DOWN',safe:'PASS IN SILENCE',resource:'salvage'}
  ]
];
const ENCOUNTER_VARIANTS=[
  [
    [['Cinder Scavenger',175,24,'front','feral'],['Ash Hound',150,24,'front','feral'],['Grainhouse Lurker',160,22,'back','lurker']],
    [['Farmhand Thrall',190,22,'front','thrall'],['Carrion Scavenger',165,24,'front','feral'],['Silo Lurker',150,24,'back','lurker']]
  ],
  [
    [['Tollhouse Reaver',225,23,'front','reaver'],['Road Reaver',220,22,'front','reaver'],['Cinder Rifleman',180,27,'back','rifleman'],['Bridge Spotter',155,18,'back','spotter']],
    [['Road Reaver',235,23,'front','reaver'],['Ashbound Rifleman',180,26,'back','rifleman'],['Ashbound Rifleman',170,25,'back','rifleman'],['Span Watcher',165,19,'back','spotter']]
  ],
  [
    [['Reliquary Husk',285,24,'front','husk'],['Chapel Thrall',215,23,'front','thrall'],['Chapel Thrall',205,23,'front','thrall'],['Bell Hand',180,27,'back','bell']],
    [['Reliquary Husk',300,24,'front','husk'],['Reliquary Husk',250,23,'front','husk'],['Votive Thrall',205,22,'front','thrall'],['Choir Bell Hand',175,28,'back','bell']]
  ],
  [
    [['Penitent Warden',880,38,'front','warden'],['Bellbound Servitor',235,25,'front','servitor'],['Ashen Servitor',245,25,'front','servitor']],
    [['Penitent Warden',895,38,'front','warden'],['Bellbound Servitor',225,25,'front','servitor'],['Censer Servitor',225,26,'front','servitor']]
  ]
];
function fresh(){return {
  version:3,screen:'title',started:false,tutorial:0,coin:90,iron:12,salvage:0,
  buildings:{hall:1,forge:1,infirmary:1,tower:1},hunters:HUNTER_BASE.map(x=>({...x,lv:1,xp:0})),
  clears:[0,0,0,0],inventory:[],equipped:{},crafted:0,eventCount:0,preparedKit:false,
  lastDrops:[],lastResult:null,wardenDefeated:false,selectedHunter:'Vanguard'
}}
let G=load();let battle=null;let timer=null;let pendingRegion=null;let pendingEvent=0;let sheet=null;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');return v&&v.version===3?v:fresh()}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(G))}
function reset(){localStorage.removeItem(KEY);G=fresh();battle=null;pendingRegion=null;pendingEvent=0;sheet=null;render()}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function objective(){
  if(G.clears[0]<1)return {n:1,title:'Open the Western Road',body:'Clear Forsaken Farmstead.',action:'MARCHES',screen:'map'};
  if(countEquipped()<1)return {n:2,title:'Arm a Hunter',body:'Equip one recovered item.',action:'INVENTORY',screen:'inventory'};
  if(G.buildings.hall<2)return {n:3,title:'Strengthen the Hunter Hall',body:'Upgrade the Hall to Level 2.',action:'HUNTER HALL',sheet:'hall'};
  if(G.clears[1]<1)return {n:4,title:'Break the Causeway',body:'Clear Hollow Causeway.',action:'MARCHES',screen:'map'};
  if(G.crafted<1)return {n:5,title:'Reconstruct the March',body:'Forge one item from recovered material.',action:'FORGE',sheet:'forge'};
  if(G.clears[2]<1)return {n:6,title:'Silence Saint Orra',body:'Clear Saint Orra Chapel.',action:'MARCHES',screen:'map'};
  if(G.clears[3]<1)return {n:7,title:'The Bell Must Stop',body:'Defeat the Penitent Warden.',action:'MARCHES',screen:'map'};
  return {n:8,title:'The Western Road Holds',body:'The first March is secure. Continue hunting equipment and sets.'};
}
function regionOpen(i){if(i===0)return true;if(i===1)return G.clears[0]>0&&G.buildings.hall>=2;if(i===2)return G.clears[1]>0&&G.crafted>=1;if(i===3)return G.clears[2]>0;return false}
function countEquipped(){return Object.keys(G.equipped||{}).length}
function equipmentFor(name){return Object.values(G.equipped||{}).filter(i=>i.owner===name)}
function setCount(setName){return Object.values(G.equipped||{}).filter(i=>i.set===setName).length}
function itemMods(name){let atk=0,hp=0;for(const i of equipmentFor(name)){atk+=i.atk||0;hp+=i.hp||0}if(setCount('Ashen Pilgrim')>=2)atk+=4;if(setCount('Mourning Watch')>=2)hp+=18;return{atk,hp}}
function hunterStats(h){const m=itemMods(h.name);return{hp:h.hp+(h.lv-1)*8+m.hp,atk:h.atk+(h.lv-1)*3+m.atk}}
function header(){return `<header class="hud"><button class="brand" data-go="enclave"><span>THE BELL BENEATH ASH</span><small>ASHEN MARCHES · P0.1 FINAL</small></button><div class="resources"><span>◈ ${G.coin}</span><span>⚒ ${G.iron}</span><span>⌁ ${G.salvage}</span></div></header>`}
function nav(){const items=[['enclave','ENCLAVE'],['hunters','HUNTERS'],['map','MARCHES'],['inventory','LOOT']];return `<nav class="bottomnav">${items.map(([s,l])=>`<button data-go="${s}" class="${G.screen===s?'active':''}"><i>${s==='enclave'?'⌂':s==='hunters'?'♜':s==='map'?'✦':'◆'}</i><span>${l}</span></button>`).join('')}</nav>`}
function directive(){const o=objective();if(o.n===8)return `<section class="directive complete"><small>REGIONAL STATUS</small><b>${o.title}</b><span>${o.body}</span></section>`;return `<section class="directive"><small>DIRECTIVE ${o.n}/7</small><b>${o.title}</b><span>${o.body}</span><button data-directive>GO</button></section>`}
function titleView(){return `<main class="titleview"><div class="titleart">${sceneSvg('title')}</div><div class="titlecopy"><small>ORIGINAL 2D GOTHIC STRATEGY RPG</small><h1>THE BELL<br>BENEATH ASH</h1><p>The old world is buried beneath a permanent fall of ash. Your Enclave survives by sending Hunters beyond the walls to reclaim roads, weapons and the things people left behind.</p><p class="muted">Something in the western March is ringing a bell that no living hand should be able to reach.</p><button class="primary huge" data-begin>${G.started?'CONTINUE':'BEGIN THE MARCH'}</button></div></main>`}
function enclaveView(){return `<main class="gameview enclaveview"><section class="worldscene">${sceneSvg('enclave')}<button class="hotspot hall" data-building="hall"><b>HUNTER HALL</b><span>LV ${G.buildings.hall}</span></button><button class="hotspot forge" data-building="forge"><b>FORGE</b><span>LV ${G.buildings.forge}</span></button><button class="hotspot infirmary" data-building="infirmary"><b>INFIRMARY</b><span>LV ${G.buildings.infirmary}</span></button><button class="hotspot tower" data-building="tower"><b>SCOUT TOWER</b><span>LV ${G.buildings.tower}</span></button><button class="hotspot store" data-go="inventory"><b>STOREHOUSE</b><span>${G.inventory.length} ITEMS</span></button><button class="hotspot guild locked"><b>GUILD HALL</b><span>SEALED</span></button></section>${directive()}${G.wardenDefeated?'<div class="victorystrip">THE PENITENT WARDEN IS DEAD · WESTERN ROAD SECURED</div>':''}</main>`}
function huntersView(){return `<main class="gameview huntersview"><section class="hunterstage">${sceneSvg('hall')}<div class="hunterrow">${G.hunters.map(h=>{const s=hunterStats(h);return `<button class="hunterportrait ${G.selectedHunter===h.name?'selected':''}" data-hunter="${h.name}">${hunterSvg(h.id)}<b>${h.name}</b><span>${h.role}</span><small>LV ${h.lv} · HP ${s.hp} · ATK ${s.atk}</small></button>`}).join('')}</div></section><section class="compactpanel"><div><small>FORMATION</small><b>${G.buildings.hall>=3?'5 HUNTERS':G.buildings.hall>=2?'4 HUNTERS':'3 HUNTERS'}</b><span>${G.buildings.hall>=2?'Enclave Guard active':'Upgrade Hunter Hall for support'}${G.buildings.hall>=3?' · March Scout active':''}</span></div><button data-building="hall">HALL LV ${G.buildings.hall}</button></section><section class="loadoutmini">${SLOTS.map(sl=>{const x=G.equipped[`${G.selectedHunter}:${sl}`];return `<button data-slot="${sl}"><small>${sl}</small><b>${x?esc(x.name):'EMPTY'}</b><span>${x?`+${x.atk||0} ATK${x.hp?` · +${x.hp} HP`:''}`:'Tap Loot to equip'}</span></button>`}).join('')}</section></main>`}
function mapView(){return `<main class="gameview mapview"><section class="marchmap">${sceneSvg('map')}<div class="route"></div>${REGIONS.map((r,i)=>`<button class="mapnode node${i} ${regionOpen(i)?'open':'closed'} ${G.clears[i]?'cleared':''}" data-region="${i}" ${regionOpen(i)?'':'disabled'}><i>${G.clears[i]?'✓':i===0?'⌂':i===1?'╫':i===2?'†':'♜'}</i><b>${regionOpen(i)?r.short:'UNKNOWN'}</b><span>${G.clears[i]?`${G.clears[i]} CLEAR${G.clears[i]>1?'S':''}`:regionOpen(i)?'OPEN':'FOG'}</span></button>`).join('')}</section><section class="mapintel"><div><small>SCOUT TOWER · LV ${G.buildings.tower}</small><b>${objective().title}</b><span>${objective().body}</span></div><button data-building="tower">INTEL</button></section></main>`}
function setCard(name){const n=setCount(name),d=SETS[name];return `<div class="setcard ${n>=4?'complete':n>=2?'active':''}"><div class="settitle"><b>${name}</b><span>${n}/4</span></div><div class="setpips">${[0,1,2,3].map(x=>`<i class="${x<n?'filled':''}"></i>`).join('')}</div><small>2PC ${n>=2?'ACTIVE':'LOCKED'} · ${d.two}</small><small>4PC ${n>=4?'ACTIVE':'LOCKED'} · ${d.four}</small></div>`}
function inventoryView(){const h=G.selectedHunter;return `<main class="gameview inventoryview"><section class="inventoryhead"><div><small>STOREHOUSE · COMPARE FOR ${h.toUpperCase()}</small><h2>Recovered Equipment</h2><span>${G.inventory.length} items · ${countEquipped()} equipped</span></div><button data-building="forge">OPEN FORGE</button></section><section class="setbar">${setCard('Ashen Pilgrim')}${setCard('Mourning Watch')}</section><section class="huntertabs">${G.hunters.map(x=>`<button class="${h===x.name?'active':''}" data-hunter="${x.name}">${x.name}</button>`).join('')}</section><section class="lootlist">${G.inventory.length?G.inventory.slice().sort((a,b)=>(b.owner===h)-(a.owner===h)||rarityRank(b.rarity)-rarityRank(a.rarity)||(b.atk||0)-(a.atk||0)).map(i=>itemRow(i,h)).join(''):'<div class="emptyloot">The shelves are empty. Enter the Marches.</div>'}</section></main>`}
function rarityRank(r){return {common:0,uncommon:1,rare:2,relic:3}[r]||0}
function currentFor(h,slot){return G.equipped[`${h}:${slot}`]||null}

function gearFor(name,state){return Object.values(state?.equipped||{}).filter(x=>x&&x.owner===name)}
function bestSet(gear){const counts={};for(const x of gear){if(x.set)counts[x.set]=(counts[x.set]||0)+1}const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return entries[0]||null}
function decorate(){
 const view=root.querySelector('.huntersview');
 if(!view||view.dataset.hhV2==='1')return;

 const role=selected.querySelector('span')?.textContent||'Hunter';
 const meta=selected.querySelector('small')?.textContent||'';
 const state=window.Game?.state;
 const hunter=state?.hunters?.find(x=>x.name===name);
 const gear=gearFor(name,state);
 const set=bestSet(gear);

 hero.className='hh-hero';
 hero.style.setProperty('--hunter-art',`url("${ART[name]||ART.Vanguard}")`);
 hero.innerHTML=`
  <div class="hh-backdrop" aria-hidden="true"></div>
  <div class="hh-vignette" aria-hidden="true"></div>
  <div class="hh-kicker"><span>HUNTER HALL</span><i>ACTIVE ROSTER</i></div>
  <div class="hh-character" aria-hidden="true"><div class="hh-character-glow"></div></div>
  <div class="hh-identity">
    <small>${role.toUpperCase()}</small>
    <h1>${name.toUpperCase()}</h1>
    <p>${CREED[name]||''}</p>
    <div class="hh-statline">${meta.split(' · ').map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="hh-xp"><i><em style="width:${pct}%"></em></i><span>EXPERIENCE ${xp}/${need}</span></div>
    <div class="hh-resonance ${set&&set[1]>=2?'active':''}"><b>${set?set[0].toUpperCase():'NO SET RESONANCE'}</b><span>${set?`${set[1]}/4 PIECES EQUIPPED`:`${gear.length}/4 LOADOUT SLOTS FILLED`}</span></div>
  </div>`;
 stage.insertBefore(hero,row);

 portraits.forEach(btn=>{
   const n=btn.dataset.hunter;
   btn.style.setProperty('--roster-art',`url("${ART[n]||ART.Vanguard}")`);
   btn.setAttribute('aria-label',`Select ${n}`);
 });

 [...loadout.querySelectorAll('button')].forEach(btn=>{
   btn.title='Open Loot to change this slot';
   btn.addEventListener('click',()=>window.Game?.go?.('inventory'));

}
