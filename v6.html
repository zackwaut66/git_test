<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070604"><title>The Bell Beneath Ash · V6</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;color:#e8dfcd;font-family:Georgia,serif}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}#app{width:100%;height:100dvh}.v6{position:relative;width:100%;height:100%;overflow:hidden;background:#070604}.grain{position:absolute;inset:0;pointer-events:none;z-index:50;opacity:.24;background:repeating-radial-gradient(ellipse at 20% 30%,rgba(255,244,220,.045) 0 1px,transparent 1px 4px);mix-blend-mode:soft-light}.wash{position:absolute;inset:0;pointer-events:none;z-index:40;background:radial-gradient(circle at 52% 38%,transparent 0 30%,rgba(0,0,0,.28) 58%,rgba(0,0,0,.9) 100%)}

/* enclave */.enclave .ambient{background:linear-gradient(180deg,#222724 0,#121714 46%,#090907 100%)}.enclave .ambient:before{content:'';position:absolute;left:-8%;right:-8%;bottom:13%;height:60%;background:linear-gradient(90deg,#0c100f 0 11%,transparent 11% 14%,#181d19 14% 31%,transparent 31% 35%,#111612 35% 48%,transparent 48% 52%,#1a1e1a 52% 71%,transparent 71% 74%,#101411 74% 100%);clip-path:polygon(0 100%,0 50%,7% 50%,7% 25%,13% 25%,13% 46%,20% 46%,20% 16%,27% 16%,27% 55%,34% 55%,34% 35%,41% 35%,41% 7%,48% 7%,48% 52%,57% 52%,57% 22%,64% 22%,64% 58%,72% 58%,72% 33%,79% 33%,79% 13%,86% 13%,86% 54%,93% 54%,93% 40%,100% 40%,100% 100%);box-shadow:0 -20px 80px #000}.enclave .ambient:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 45% 58%,rgba(169,111,55,.2),transparent 18%),radial-gradient(circle at 72% 52%,rgba(140,83,43,.12),transparent 20%),linear-gradient(0deg,#070604 0,transparent 34%)}.facility{position:absolute;z-index:8;border:0;background:none;padding:0;text-align:left;text-shadow:0 3px 10px #000}.facility b{display:block;font-size:11px;font-weight:500;letter-spacing:.4px}.facility span{display:block;font:600 5px ui-monospace,monospace;letter-spacing:1px;color:#8c7a61;margin-top:2px}.facility:after{content:'';display:block;width:34px;height:1px;background:#8f7652;margin-top:4px;opacity:.7}.f-hall{left:10%;top:48%}.f-forge{left:42%;top:61%}.f-infirmary{right:9%;top:51%;text-align:right}.f-infirmary:after{margin-left:auto}.f-tower{right:18%;top:26%;text-align:right}.f-tower:after{margin-left:auto}.f-store{left:22%;top:30%}.mission{position:absolute;z-index:9;left:15px;right:15px;bottom:54px;max-width:560px;text-shadow:0 3px 10px #000}.mission small{display:block;font:600 6px ui-monospace,monospace;letter-spacing:1.5px;color:#8c7657}.mission b{display:block;margin:4px 0;font-size:17px;font-weight:500}.mission span{font-size:8px;color:#8f887d}.mission button{float:right;margin-top:-22px;border:0;background:none;color:#c4a575;font-size:22px}
/* hunters */.hunters{background:#080705}.hunters .ambient{background:url('./assets/hunter-hall-interior-v2.svg') center/cover no-repeat;filter:brightness(.33) saturate(.42) contrast(1.12)}.hero-art{position:absolute;z-index:4;left:8%;right:8%;top:4%;bottom:13%;background:var(--hero) center bottom/contain no-repeat;filter:drop-shadow(0 25px 24px #000) saturate(.9)}.hunter-name{position:absolute;z-index:8;left:15px;bottom:23%;text-shadow:0 4px 16px #000}.hunter-name small{display:block;font:600 6px ui-monospace,monospace;letter-spacing:1.8px;color:#a0845d}.hunter-name h2{font-size:42px;font-weight:500;line-height:.85;margin:5px 0}.hunter-name p{font-size:9px;font-style:italic;color:#9d968b;margin:0;max-width:250px}.roster-orbit{position:absolute;z-index:10;right:11px;top:64px;display:flex;flex-direction:column;gap:12px}.roster-orbit button{width:48px;height:48px;border:0;border-radius:50%;background:rgba(9,8,6,.5);padding:0;overflow:hidden;opacity:.36;box-shadow:0 0 0 1px rgba(156,130,87,.16)}.roster-orbit button:before{content:'';display:block;width:100%;height:100%;background:var(--thumb) center 16%/42px auto no-repeat}.roster-orbit button.active{opacity:1;box-shadow:0 0 0 1px #a78959,0 0 22px rgba(167,126,65,.16)}.gear-words{position:absolute;z-index:9;right:13px;bottom:19%;text-align:right}.gear-words button{display:block;border:0;background:none;padding:3px 0;font:600 6px ui-monospace,monospace;letter-spacing:1px;color:#786e60}.gear-words button.filled{color:#c1a77d}.hunter-stats{position:absolute;z-index:8;left:15px;right:15px;bottom:55px;display:flex;gap:18px;align-items:end;text-shadow:0 3px 10px #000}.hunter-stats div small{display:block;font:600 5px ui-monospace,monospace;color:#746b60;letter-spacing:1px}.hunter-stats div b{display:block;font-size:18px;font-weight:500;margin-top:2px}.hunter-stats .set{margin-left:auto;text-align:right}
/* map */.map{background:#0b0906}.map .ambient{background:radial-gradient(circle at 47% 44%,#2e281d 0,#15110b 40%,#070604 82%)}.map .ambient:before{content:'';position:absolute;inset:8% 5% 13%;background:repeating-radial-gradient(ellipse at 28% 56%,transparent 0 24px,rgba(187,159,110,.035) 25px 26px);clip-path:polygon(4% 10%,20% 4%,38% 8%,51% 3%,71% 8%,93% 4%,97% 22%,94% 40%,99% 58%,94% 78%,97% 93%,76% 96%,61% 91%,43% 97%,27% 92%,8% 97%,4% 78%,8% 61%,3% 41%,7% 23%);box-shadow:inset 0 0 70px #000}.trail{position:absolute;z-index:5;left:12%;bottom:18%;width:72%;height:58%;border-left:2px solid rgba(169,140,91,.55);border-bottom:2px solid rgba(169,140,91,.45);transform:rotate(-18deg) skewX(-18deg);border-radius:46% 0 42% 32%;opacity:.7}.node{position:absolute;z-index:9;border:0;background:none;padding:0;text-shadow:0 3px 10px #000;text-align:left}.node i{display:block;width:15px;height:15px;border:1px solid #a18458;border-radius:50%;background:#151009;box-shadow:0 0 0 5px rgba(8,6,4,.8)}.node b{display:block;margin-top:7px;font-size:9px;font-weight:500}.node span{display:block;font:600 5px ui-monospace,monospace;letter-spacing:.8px;color:#7c715f;margin-top:2px}.n0{left:14%;bottom:18%}.n1{left:37%;bottom:38%}.n2{left:61%;top:31%}.n3{right:10%;top:14%}.node.closed{opacity:.25}.map-intel{position:absolute;z-index:8;left:15px;bottom:56px;text-shadow:0 3px 10px #000}.map-intel small{font:600 5px ui-monospace,monospace;letter-spacing:1.4px;color:#7c6c55}.map-intel b{display:block;margin-top:4px;font-size:15px;font-weight:500}
/* loot */.loot{background:radial-gradient(circle at 50% 0,#191109,#070604 55%)}.loot-scroll{position:absolute;z-index:5;left:15px;right:15px;top:70px;bottom:54px;overflow:auto;padding-right:4px}.loot-line{position:relative;min-height:78px;padding:11px 68px 12px 8px;border-bottom:1px solid rgba(121,100,69,.28)}.loot-line:before{content:'✦';position:absolute;left:0;top:15px;color:#9c7f53;font-size:9px}.loot-line small,.loot-line b,.loot-line span{display:block;margin-left:18px}.loot-line small{font:600 5px ui-monospace,monospace;letter-spacing:1.1px;color:#7f6e56}.loot-line b{font-size:13px;font-weight:500;margin-top:5px}.loot-line span{font-size:7px;color:#82796c;margin-top:4px}.loot-line button{position:absolute;right:0;top:18px;border:0;background:none;font:600 6px ui-monospace,monospace;letter-spacing:1px;color:#b99a69;padding:8px 0}.empty{padding:30px 0;color:#766d61;font-style:italic;font-size:12px}
/* toast */.toast{position:absolute;z-index:60;left:50%;bottom:72px;transform:translateX(-50%);font:600 6px ui-monospace,monospace;letter-spacing:1.2px;color:#d7c49e;text-shadow:0 3px 8px #000;opacity:0;transition:.2s}.toast.show{opacity:1}
</style></head><body><div id="app"></div><script>
(()=>{const A='./assets/';const ART={Vanguard:A+'hunter-vanguard-v2.svg',Duelist:A+'hunter-duelist-v2.svg',Physician:A+'hunter-physician-v2.svg'};const KEY='bell-v6';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{started:false,screen:'title',coin:90,iron:12,salvage:0,selected:'Vanguard',clears:0,loot:[]};const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const app=document.querySelector('#app');const objective=()=>s.clears?'Return to the Marches':'Open the Western Road';const desc=()=>s.clears?'Push farther into the Ashen Marches.':'Clear the Forsaken Farmstead.';function chrome(active){return `<div class="brandline">THE BELL BENEATH ASH</div><div class="resline"><span>◈ ${s.coin}</span><span>⚒ ${s.iron}</span><span>⌁ ${s.salvage}</span></div><nav class="navline">${[['enclave','ENCLAVE'],['hunters','HUNTERS'],['map','MARCHES'],['loot','LOOT']].map(([k,l])=>`<button data-go="${k}" class="${active===k?'active':''}">${l}</button>`).join('')}</nav>`}function title(){return `<section class="screen title"><div class="ambient"></div><svg class="cathedral" viewBox="0 0 420 720"><path d="M80 690V240L210 60l130 180v450z"/><path d="M130 690V270l80-112 80 112v420z"/><path d="M181 690V350q29-66 58 0v340z"/><path d="M205 158V50h10v108z"/><path d="M164 107h92v10h-92z"/><ellipse class="glow" cx="210" cy="390" rx="84" ry="180"/></svg><div class="ash"></div><div class="title-copy"><small>WESTERN ENCLAVE // YEAR UNKNOWN</small><h1>THE BELL<br>BENEATH ASH</h1><p>The world did not end cleanly. It sank into ash, prayer, hunger, and ruins that still remember being alive.</p><button class="begin" data-begin>${s.started?'CONTINUE THE MARCH':'ENTER THE ENCLAVE'}</button></div></section>`}function enclave(){return `<section class="screen enclave"><div class="ambient"></div>${chrome('enclave')}<div class="screen-title"><small>LAST HABITABLE HOLD</small><b>The Enclave</b></div><button class="facility f-hall" data-go="hunters"><b>Hunter Hall</b><span>ACTIVE ROSTER</span></button><button class="facility f-forge" data-toast="Forge reconstruction will return in the next pass"><b>Forge</b><span>IRONWORKS</span></button><button class="facility f-infirmary" data-toast="Infirmary ready"><b>Infirmary</b><span>FIELD CARE</span></button><button class="facility f-tower" data-go="map"><b>Scout Tower</b><span>WESTERN ROAD</span></button><button class="facility f-store" data-go="loot"><b>Storehouse</b><span>${s.loot.length} RECOVERED</span></button><div class="mission"><small>DIRECTIVE</small><b>${objective()}</b><span>${desc()}</span><button data-go="map">›</button></div></section>`}function hunters(){const h=s.selected;return `<section class="screen hunters"><div class="ambient"></div>${chrome('hunters')}<div class="screen-title"><small>HUNTER HALL</small><b>Active Roster</b></div><div class="hero-art" style="--hero:url('${ART[h]}')"></div><div class="roster-orbit">${Object.keys(ART).map(n=>`<button data-hunter="${n}" class="${n===h?'active':''}" style="--thumb:url('${ART[n]}')" aria-label="${n}"></button>`).join('')}</div><div class="hunter-name"><small>${h==='Vanguard'?'FRONTLINE // THE WALL':h==='Duelist'?'STRIKER // THE KNIFE':'SUPPORT // THE LANTERN'}</small><h2>${h.toUpperCase()}</h2><p>${h==='Vanguard'?'Hold the breach. Bring the others home.':h==='Duelist'?'Find the opening. End it before it answers.':'Keep the line alive long enough to finish the hunt.'}</p></div><div class="gear-words"><button>WEAPON — EMPTY</button><button>HEAD — EMPTY</button><button>ARMOR — EMPTY</button><button>CHARM — EMPTY</button></div><div class="hunter-stats"><div><small>VITALITY</small><b>${h==='Vanguard'?170:h==='Duelist'?116:126}</b></div><div><small>STRIKE</small><b>${h==='Vanguard'?16:h==='Duelist'?24:12}</b></div><div class="set"><small>RESONANCE</small><b>0 / 4</b></div></div></section>`}function map(){const c=s.clears;return `<section class="screen map"><div class="ambient"></div>${chrome('map')}<div class="screen-title"><small>SCOUT CARTOGRAPHY</small><b>Ashen Marches</b></div><div class="trail"></div><div class="nodes"><button class="node n0" data-expedition><i></i><b>Forsaken Farmstead</b><span>${c?'CLEARED':'OPEN'}</span></button><button class="node n1 ${c?'':'closed'}" ${c?'data-toast="Hollow Causeway is the next expedition"':''}><i></i><b>${c?'Hollow Causeway':'Unknown'}</b><span>${c?'OPEN':'FOG'}</span></button><button class="node n2 closed"><i></i><b>Unknown</b><span>FOG</span></button><button class="node n3 closed"><i></i><b>Unknown</b><span>FOG</span></button></div><div class="map-intel"><small>WESTERN ROAD</small><b>${objective()}</b></div></section>`}function loot(){return `<section class="screen loot">${chrome('loot')}<div class="screen-title"><small>STOREHOUSE</small><b>Recovered Relics</b></div><div class="loot-scroll">${s.loot.length?s.loot.map((x,i)=>`<article class="loot-line"><small>${x.rarity.toUpperCase()} // ${x.slot}</small><b>${x.name}</b><span>${x.note}</span><button data-equip="${i}">EQUIP →</button></article>`).join(''):'<div class="empty">Nothing has been carried home yet.</div>'}</div></section>`}function render(){app.innerHTML=`<main class="v6">${s.screen==='title'?title():s.screen==='enclave'?enclave():s.screen==='hunters'?hunters():s.screen==='map'?map():loot()}<div class="wash"></div><div class="grain"></div><div class="toast" id="toast"></div></main>`;bind()}function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{s.screen=b.dataset.go;s.started=true;save();render()});document.querySelector('[data-begin]')?.addEventListener('click',()=>{s.started=true;s.screen='enclave';save();render()});document.querySelectorAll('[data-hunter]').forEach(b=>b.onclick=()=>{s.selected=b.dataset.hunter;save();render()});document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));document.querySelector('[data-expedition]')?.addEventListener('click',()=>{if(!s.clears){s.clears=1;s.coin+=28;s.iron+=18;s.salvage+=3;s.loot.push({rarity:'uncommon',slot:'Weapon',name:'Ash-Bitten Sabre',note:'+6 ATK · recovered from the Farmstead'});save();render();setTimeout(()=>toast('FARMSTEAD CLEARED // RELIC RECOVERED'),50)}else toast('Farmstead already cleared')});document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>toast('Equipped to '+s.selected))}render()})();
</script></body></html>
