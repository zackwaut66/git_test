name: Validate Prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check systems.js
          node --check combat.js
          node --check sw.js
      - name: Verify required files
        run: |
          test -f index.html
          test -f style.css
          test -f events.css
          test -f systems.css
          test -f combat.css
          test -f manifest.webmanifest
