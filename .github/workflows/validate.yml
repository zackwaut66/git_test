name: Validate Prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check browser-smoke.mjs
          node --check audit-1000.mjs
      - name: Verify active build files
        run: |
          test -f index.html
          test -f app.js
          test -f app.css
          test -f icon.svg
          test -f manifest.webmanifest
          grep -q 'app.js' index.html
          grep -q 'app.css' index.html
