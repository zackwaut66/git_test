name: Validate Prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check game JavaScript syntax
        run: |
          node --check app.js
          node --check v7.js
          node --check facilities-v17.js
          node --check hunters-v18.js
          node --check combat-v19.js
          node --check map-v20.js
          node --check contracts-v21.js
          node --check huntmaster-v22.js
          node --check guild-v23.js
          node --check ui-v24.js
          node --check polish-v25.js
          node --check enclave-v26.js
          node --check kingdom-v27.js
          node --check kingdom-v28.js
          node --check strategy-v30.js
          node --check browser-smoke.mjs
          node --check facilities-smoke.mjs
          node --check hunters-smoke.mjs
          node --check combat-controls-smoke.mjs
          node --check map-intel-smoke.mjs
          node --check contracts-smoke.mjs
          node --check huntmaster-smoke.mjs
          node --check guild-smoke.mjs
          node --check ui-smoke.mjs
          node --check kingdom-smoke.mjs
          node --check kingdom-visual-smoke.mjs
          node --check polish-v29-smoke.mjs
          node --check strategy-smoke.mjs
          node --check audit-1000.mjs
      - name: Verify active build files
        run: |
          test -f index.html
          test -f app.js
          test -f app.css
          test -f v7.js
          test -f v7.css
          test -f facilities-v17.js
          test -f facilities-v17.css
          test -f hunters-v18.js
          test -f hunters-v18.css
          test -f combat-v19.js
          test -f combat-v19.css
          test -f map-v20.js
          test -f map-v20.css
          test -f contracts-v21.js
          test -f contracts-v21.css
          test -f huntmaster-v22.js
          test -f huntmaster-v22.css
          test -f guild-v23.js
          test -f guild-v23.css
          test -f ui-v24.js
          test -f ui-v24.css
          test -f ui-v24-fixes.css
          test -f polish-v25.js
          test -f polish-v25.css
          test -f enclave-v26.js
          test -f enclave-v26.css
          test -f kingdom-v27.js
          test -f kingdom-v27.css
          test -f kingdom-v28.js
          test -f kingdom-v28.css
          test -f strategy-v30.js
          test -f strategy-v30.css
          test -f assets/enclave-v26.svg
          test -f assets/hunter-vanguard-v2.svg
          test -f assets/hunter-duelist-v2.svg
          test -f assets/hunter-physician-v2.svg
          grep -Eq 'app\.js\?v=[0-9]+' index.html
          grep -Eq 'v7\.js\?v=[0-9]+' index.html
          grep -Eq 'guild-v23\.js\?v=[0-9]+' index.html
          grep -Eq 'ui-v24\.js\?v=[0-9]+' index.html
          grep -Eq 'polish-v25\.js\?v=[0-9]+' index.html
          grep -Eq 'enclave-v26\.js\?v=[0-9]+' index.html
          grep -Eq 'kingdom-v27\.js\?v=[0-9]+' index.html
          grep -Eq 'kingdom-v27\.css\?v=[0-9]+' index.html
          grep -Eq 'kingdom-v28\.js\?v=[0-9]+' index.html
          grep -Eq 'kingdom-v28\.css\?v=[0-9]+' index.html
          grep -Eq 'strategy-v30\.js\?v=[0-9]+' index.html
          grep -Eq 'strategy-v30\.css\?v=[0-9]+' index.html
          ! grep -q 'assets/runtime/' index.html
          grep -q 'stable-vector-art' v7.js
          grep -q 'v7-hunterhall' v7.js
