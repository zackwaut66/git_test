name: Validate Prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check game JavaScript syntax
        run: |
          node --check app.js
          node --check v7.js
          node --check facilities-v17.js
          node --check hunters-v18.js
          node --check combat-v19.js
          node --check map-v20.js
          node --check contracts-v21.js
          node --check huntmaster-v22.js
          node --check browser-smoke.mjs
          node --check facilities-smoke.mjs
          node --check hunters-smoke.mjs
          node --check combat-controls-smoke.mjs
          node --check map-intel-smoke.mjs
          node --check contracts-smoke.mjs
          node --check huntmaster-smoke.mjs
          node --check audit-1000.mjs
      - name: Verify active build files
        run: |
          test -f index.html
          test -f app.js
          test -f app.css
          test -f v7.js
          test -f v7.css
          test -f facilities-v17.js
          test -f facilities-v17.css
          test -f hunters-v18.js
          test -f hunters-v18.css
          test -f combat-v19.js
          test -f combat-v19.css
          test -f map-v20.js
          test -f map-v20.css
          test -f contracts-v21.js
          test -f contracts-v21.css
          test -f huntmaster-v22.js
          test -f huntmaster-v22.css
          test -f assets/hunter-vanguard-v2.svg
          test -f assets/hunter-duelist-v2.svg
          test -f assets/hunter-physician-v2.svg
          grep -Eq 'app\.js\?v=[0-9]+' index.html
          grep -Eq 'v7\.js\?v=[0-9]+' index.html
          grep -Eq 'v7\.css\?v=[0-9]+' index.html
          grep -Eq 'facilities-v17\.js\?v=[0-9]+' index.html
          grep -Eq 'facilities-v17\.css\?v=[0-9]+' index.html
          grep -Eq 'hunters-v18\.js\?v=[0-9]+' index.html
          grep -Eq 'hunters-v18\.css\?v=[0-9]+' index.html
          grep -Eq 'combat-v19\.js\?v=[0-9]+' index.html
          grep -Eq 'combat-v19\.css\?v=[0-9]+' index.html
          grep -Eq 'map-v20\.js\?v=[0-9]+' index.html
          grep -Eq 'map-v20\.css\?v=[0-9]+' index.html
          grep -Eq 'contracts-v21\.js\?v=[0-9]+' index.html
          grep -Eq 'contracts-v21\.css\?v=[0-9]+' index.html
          grep -Eq 'huntmaster-v22\.js\?v=[0-9]+' index.html
          grep -Eq 'huntmaster-v22\.css\?v=[0-9]+' index.html
          grep -q 'v7-hunterhall' v7.js
