name: Package Deploy Source
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'hunterhall-overrides.css'
      - 'hunterhall-polish.css'
      - 'hunterhall-v2.js'
      - 'assets/**'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/package-source.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-deploy-source
          path: |
            index.html
            app.js
            app.css
            hunterhall-overrides.css
            hunterhall-polish.css
            hunterhall-v2.js
            assets/
            icon.svg
            manifest.webmanifest
            sw.js
          if-no-files-found: error
