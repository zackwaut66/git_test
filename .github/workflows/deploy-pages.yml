name: Deploy Playable to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this repository; deployment skipped without failing CI."
          fi

      - name: Prepare playable site
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp app.js _site/app.js
          cp app.css _site/app.css
          cp hunterhall-v3.js _site/hunterhall-v3.js
          cp hunterhall-v3.css _site/hunterhall-v3.css
          cp icon.svg _site/icon.svg
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp assets/hunter-vanguard-v2.svg _site/assets/hunter-vanguard-v2.svg
          cp assets/hunter-duelist-v2.svg _site/assets/hunter-duelist-v2.svg
          cp assets/hunter-physician-v2.svg _site/assets/hunter-physician-v2.svg
          cp assets/hunter-hall-interior-v2.svg _site/assets/hunter-hall-interior-v2.svg
          touch _site/.nojekyll

      - name: Setup Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
