name: Deploy Playable to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this repository; deployment skipped without failing CI."
          fi

      - name: Prepare playable site
        if: steps.pages.outputs.enabled == 'true'
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html icon.svg manifest.webmanifest _site/
          cp *.js _site/
          cp *.css _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('_site/index.html').read_text()
          refs = re.findall(r'(?:src|href)="([^"?#]+)', html)
          missing = []
          for ref in refs:
              if ref.startswith(('http://','https://','data:','#')):
                  continue
              target = Path('_site') / ref
              if not target.exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing deploy assets: ' + ', '.join(missing))
          print(f'Playable site prepared with {len(refs)} referenced local assets verified.')
          PY

      - name: Setup Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live playable
        if: steps.pages.outputs.enabled == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}/"
          for path in \
            "" \
            "preflight.js?v=1" \
            "foundation.js?v=1" \
            "backend-sync.js?v=1" \
            "backend-sync.css?v=1" \
            "strategy-v30.js?v=1" \
            "kingdom-v28.css?v=1" \
            "guild-v23.js?v=1" \
            "assets/enclave-v26.svg"
          do
            echo "Verifying ${base}${path}"
            curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors \
              --output /tmp/live-asset "${base}${path}"
            test -s /tmp/live-asset
          done
          html=$(curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors "${base}")
          printf '%s' "$html" | grep -q 'preflight.js?v=1'
          printf '%s' "$html" | grep -q 'foundation.js?v=1'
          printf '%s' "$html" | grep -q 'backend-sync.js?v=1'
          printf '%s' "$html" | grep -q 'strategy-v30.js?v=1'
          echo "Live V30 foundation-hardened cloud-capable playable verified at ${base}"
