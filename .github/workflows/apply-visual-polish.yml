name: Apply 0.1c Visual Polish
on:
  push:
    branches: [main]
    paths:
      - 'visual-polish-p01c.py'
      - '.github/workflows/apply-visual-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply visual and combat-feel polish
        run: python3 visual-polish-p01c.py
      - name: Commit polished prototype
        run: |
          if git diff --quiet -- app.js app.css; then
            echo 'No visual changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js app.css
          git commit -m 'Polish 0.1c visuals and combat feedback'
          git push
