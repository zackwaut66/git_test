name: Deploy Ashen Marches
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'v7.js'
      - 'v7.css'
      - 'v7-art-polish.css'
      - 'combat-v8.js'
      - 'combat-v8.css'
      - 'map-v9.css'
      - 'enclave-v10.css'
      - 'result-v11.css'
      - 'title-v12.css'
      - 'causeway-v13.css'
      - 'chapel-v14.css'
      - 'warden-v15.css'
      - 'storehouse-v16.css'
      - 'assets/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4