name: Browser Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '**/*.js'
      - '*.mjs'
      - '**/*.mjs'
      - '*.css'
      - '**/*.css'
      - 'manifest.webmanifest'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8080 >/tmp/ashen-http.log 2>&1 &
      - name: Run mobile browser smoke test
        run: node browser-smoke.mjs
      - name: Run 1000-playthrough audit
        run: node audit-1000.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-audit-1000
          path: |
            audit-1000-results.json
            audit-tutorial.png
            audit-enclave.png
            audit-map.png
            audit-combat.png
            audit-result.png
            audit-inventory.png
          if-no-files-found: warn
