name: Browser Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'hunterhall-overrides.css'
      - 'hunterhall-polish.css'
      - 'hunterhall-v2.js'
      - 'assets/**'
      - 'browser-smoke.mjs'
      - 'audit-1000.mjs'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8080 >/tmp/bell-http.log 2>&1 &
      - name: Run mobile browser smoke test
        run: node browser-smoke.mjs
      - name: Run 1000-playthrough audit
        run: node audit-1000.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-audit-1000-p01d
          path: |
            audit-1000-results.json
            audit-title.png
            audit-enclave.png
            audit-map.png
            audit-combat.png
            audit-result.png
            audit-inventory.png
            hunterhall-preview.png
          if-no-files-found: warn
      - name: Package deployable source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-deploy-source
          path: |
            index.html
            app.js
            app.css
            hunterhall-overrides.css
            hunterhall-polish.css
            hunterhall-v2.js
            assets/
            icon.svg
            manifest.webmanifest
            sw.js
          if-no-files-found: error
