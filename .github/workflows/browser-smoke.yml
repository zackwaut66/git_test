name: Browser Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'v7.js'
      - 'v7.css'
      - 'v7-art-polish.css'
      - 'combat-v8.js'
      - 'combat-v8.css'
      - 'map-v9.css'
      - 'enclave-v10.css'
      - 'result-v11.css'
      - 'title-v12.css'
      - 'assets/**'
      - 'browser-smoke.mjs'
      - 'audit-1000.mjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8080 >/tmp/bell-http.log 2>&1 &
      - name: Run mobile browser smoke test
        run: node browser-smoke.mjs
      - name: Run 1000-playthrough audit
        run: node audit-1000.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-audit-v12
          path: |
            audit-1000-results.json
            audit-title.png
            audit-enclave.png
            audit-map.png
            audit-combat.png
            audit-result.png
            audit-inventory.png
            title-v12-preview.png
            enclave-v10-preview.png
            hunterhall-preview.png
            map-v9-preview.png
            combat-v8-preview.png
            result-v11-preview.png
          if-no-files-found: warn
      - name: Package deployable source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-deploy-source-v12
          path: |
            index.html
            app.js
            app.css
            v7.js
            v7.css
            v7-art-polish.css
            combat-v8.js
            combat-v8.css
            map-v9.css
            enclave-v10.css
            result-v11.css
            title-v12.css
            assets/
            icon.svg
            manifest.webmanifest
          if-no-files-found: error
