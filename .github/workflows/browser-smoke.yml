name: Browser Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'v7.js'
      - 'v7.css'
      - 'v7-art-polish.css'
      - 'combat-v8.js'
      - 'combat-v8.css'
      - 'map-v9.css'
      - 'enclave-v10.css'
      - 'result-v11.css'
      - 'title-v12.css'
      - 'causeway-v13.css'
      - 'chapel-v14.css'
      - 'warden-v15.css'
      - 'storehouse-v16.css'
      - 'facilities-v17.js'
      - 'facilities-v17.css'
      - 'hunters-v18.js'
      - 'hunters-v18.css'
      - 'combat-v19.js'
      - 'combat-v19.css'
      - 'map-v20.js'
      - 'map-v20.css'
      - 'contracts-v21.js'
      - 'contracts-v21.css'
      - 'huntmaster-v22.js'
      - 'huntmaster-v22.css'
      - 'guild-v23.js'
      - 'guild-v23.css'
      - 'ui-v24.js'
      - 'ui-v24.css'
      - 'ui-v24-fixes.css'
      - 'polish-v25.js'
      - 'polish-v25.css'
      - 'enclave-v26.js'
      - 'enclave-v26.css'
      - 'kingdom-v27.js'
      - 'kingdom-v27.css'
      - 'kingdom-v28.js'
      - 'kingdom-v28.css'
      - 'polish-v29.js'
      - 'polish-v29.css'
      - 'assets/**'
      - '*-smoke.mjs'
      - 'audit-1000.mjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8080 >/tmp/bell-http.log 2>&1 &
      - name: Run mobile browser smoke test
        run: node browser-smoke.mjs
      - name: Run Hollow Causeway visual smoke test
        run: node causeway-smoke.mjs
      - name: Run Saint Orra Chapel visual smoke test
        run: node chapel-smoke.mjs
      - name: Run Penitent Warden boss smoke test
        run: node warden-smoke.mjs
      - name: Run Storehouse and Forge smoke test
        run: node storehouse-smoke.mjs
      - name: Run Infirmary and Scout Tower smoke test
        run: node facilities-smoke.mjs
      - name: Run Hunter progression dossier smoke test
        run: node hunters-smoke.mjs
      - name: Run Tactical Pause combat controls smoke test
        run: node combat-controls-smoke.mjs
      - name: Run March intelligence smoke test
        run: node map-intel-smoke.mjs
      - name: Run post-Warden Hunt Board smoke test
        run: node contracts-smoke.mjs
      - name: Run Last Toll mastery hunt smoke test
        run: node huntmaster-smoke.mjs
      - name: Run Guild Hall and Guild War smoke test
        run: node guild-smoke.mjs
      - name: Run production UI smoke test
        run: node ui-smoke.mjs
      - name: Run Enclave expansion mechanics smoke test
        run: node kingdom-smoke.mjs
      - name: Run dynamic Enclave visual-growth smoke test
        run: node kingdom-visual-smoke.mjs
      - name: Run V29 interaction polish smoke test
        run: node polish-v29-smoke.mjs
      - name: Run 1000-playthrough audit
        run: node audit-1000.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-audit-v29
          path: |
            audit-1000-results.json
            audit-title.png
            audit-enclave.png
            audit-map.png
            audit-combat.png
            audit-result.png
            audit-inventory.png
            title-v12-preview.png
            enclave-v10-preview.png
            hunterhall-preview.png
            map-v9-preview.png
            combat-v8-preview.png
            result-v11-preview.png
            causeway-event-v13.png
            causeway-combat-v13.png
            causeway-result-v13.png
            chapel-event-v14.png
            chapel-combat-v14.png
            chapel-result-v14.png
            warden-v15-preview.png
            warden-v15-result.png
            storehouse-v16-preview.png
            forge-v16-preview.png
            infirmary-v17-preview.png
            scout-tower-v17-preview.png
            hunter-dossier-v18-preview.png
            combat-v19-tactical-pause.png
            map-v20-intel-preview.png
            hunt-board-v21-preview.png
            hunt-contract-v21-result.png
            last-toll-v22-board.png
            last-toll-v22-battle.png
            last-toll-v22-result.png
            guild-hall-v23-preview.png
            guild-war-v23-prep.png
            guild-war-v23-result.png
            ui-v24-title.png
            ui-v24-enclave.png
            ui-v24-inventory.png
            ui-v24-guild.png
            ui-v24-combat.png
            kingdom-v27-domain-start.png
            kingdom-v27-domain-built.png
            kingdom-v28-enclave-fresh.png
            kingdom-v28-enclave-fortress.png
          if-no-files-found: warn
      - name: Package deployable source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-deploy-source-v29
          path: |
            index.html
            app.js
            app.css
            v7.js
            v7.css
            v7-art-polish.css
            combat-v8.js
            combat-v8.css
            map-v9.css
            enclave-v10.css
            result-v11.css
            title-v12.css
            causeway-v13.css
            chapel-v14.css
            warden-v15.css
            storehouse-v16.css
            facilities-v17.js
            facilities-v17.css
            hunters-v18.js
            hunters-v18.css
            combat-v19.js
            combat-v19.css
            map-v20.js
            map-v20.css
            contracts-v21.js
            contracts-v21.css
            huntmaster-v22.js
            huntmaster-v22.css
            guild-v23.js
            guild-v23.css
            ui-v24.js
            ui-v24.css
            ui-v24-fixes.css
            polish-v25.js
            polish-v25.css
            enclave-v26.js
            enclave-v26.css
            kingdom-v27.js
            kingdom-v27.css
            kingdom-v28.js
            kingdom-v28.css
            polish-v29.js
            polish-v29.css
            assets/
            icon.svg
            manifest.webmanifest
          if-no-files-found: error