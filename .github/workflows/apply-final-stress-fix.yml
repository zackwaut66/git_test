name: Apply Final Stress Coverage Fix
on:
  push:
    branches: [main]
    paths:
      - 'fix-final-stress.py'
      - '.github/workflows/apply-final-stress-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply final coverage correction
        run: python3 fix-final-stress.py
      - name: Commit corrected final build and stress harness
        run: |
          if git diff --quiet -- app.js stress-final.mjs; then
            echo 'No correction needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js stress-final.mjs
          git commit -m 'Correct final stress coverage validation'
          git push
