name: Build Standalone Playable
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'app.css'
      - 'hunterhall-overrides.css'
      - 'hunterhall-polish.css'
      - 'hunterhall-v2.js'
      - 'assets/**'
      - 'icon.svg'
      - 'tools/build_standalone.py'
      - '.github/workflows/build-standalone.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build self-contained playable HTML
        run: python3 tools/build_standalone.py
      - name: Commit standalone bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standalone.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build standalone playable prototype"
          git push
