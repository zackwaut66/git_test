name: V28 10000 Stress Gate
on:
  push:
    branches: [main]
    paths:
      - 'stress-10000-v28.mjs'
      - '.github/workflows/stress-10000-v28.yml'
  workflow_dispatch:
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8080 >/tmp/bell-http.log 2>&1 &
      - name: Run 10,000 background-mechanics profiles
        run: node stress-10000-v28.mjs
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-10000-v28-results
          path: stress-10000-v28-results.json
          if-no-files-found: warn
