(()=>{'use strict';const root=document.querySelector('#app');const R=['Forsaken Farmstead','Hollow Causeway','Saint Orra Chapel','Penitent Warden'];const RA=['FARMSTEAD','CAUSEWAY','SAINT ORRA','WARDEN'];const ART={Vanguard:'./assets/hunter-vanguard-v2.svg',Duelist:'./assets/hunter-duelist-v2.svg',Physician:'./assets/hunter-physician-v2.svg'};const CREED={Vanguard:'Hold the breach. Break the charge. Bring the others home.',Duelist:'Find the opening. End the threat before it can answer.',Physician:'Keep the line alive long enough to finish what crossed it.'};const ICON={Weapon:'⚔',Head:'◉',Armor:'⛨',Charm:'✦'};let queued=false,last='';function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function G(){return window.Game?.state}function B(){return window.Game?.battle}function sig(){const g=G(),b=B();return JSON.stringify([g?.screen,g?.coin,g?.iron,g?.salvage,g?.selectedHunter,g?.inventory?.length,g?.crafted,g?.preparedKit,g?.clears,g?.buildings,Object.keys(g?.equipped||{}).length,b?.turn,b?.resolve,b?.party?.map(x=>x.hp),b?.enemies?.map(x=>x.hp),b?.target])}function shell(body,screen){const g=G();return `<div class="v5-root"><div class="v5-grain"></div>${screen==='title'?'':`<aside class="v5-rail"><div class="v5-sigilmark">B</div><nav class="v5-nav">${[['enclave','⌂','HOME'],['hunters','♜','HUNTERS'],['map','✦','MARCH'],['inventory','◆','LOOT']].map(x=>`<button data-v5-go="${x[0]}" class="${g.screen===x[0]?'active':''}"><i>${x[1]}</i><span>${x[2]}</span></button>`).join('')}</nav><div class="v5-version">REBUILT UI // V5</div></aside><header class="v5-top"><div class="v5-brand"><small>THE WESTERN MARCH</small><b>THE BELL BENEATH ASH</b></div><div class="v5-res"><span>◈ ${g.coin}</span><span>⚒ ${g.iron}</span><span>⌁ ${g.salvage}</span></div></header>`}<main class="${screen==='title'?'':'v5-main'}">${body}</main></div>`}function objectiveButton(){const o=Game.objective();if(!o||o.n===8)return '';return `<button data-v5-objective>→</button>`}function title(){const g=G();return shell(`<section class="v5-title"><div class="v5-title-id">ORIGINAL GOTHIC STRATEGY RPG // MOBILE PROTOTYPE</div><div class="v5-title-copy"><small>ENCLAVE RECORD // WESTERN ROAD</small><h1>THE BELL<br>BENEATH ASH</h1><p>The old world is buried beneath permanent ash. Send Hunters beyond the walls, reclaim the Marches, recover relics, and silence the bell that should have no living keeper.</p><button data-v5-begin>${g.started?'RETURN TO THE ENCLAVE':'BEGIN THE MARCH'}</button></div></section>`,'title')}function enclave(){const g=G(),o=Game.objective();const buildings=[['hall','HUNTER HALL','Formation capacity'],['forge','FORGE','Reconstruct equipment'],['infirmary','INFIRMARY','Field preparation'],['tower','SCOUT TOWER','March intelligence']];return shell(`<section class="v5-screen v5-enclave"><div class="v5-enclave-bg"></div><div class="v5-screenhead"><small>LAST HABITABLE HOLD</small><b>THE ENCLAVE</b></div><div class="v5-buildings">${buildings.map(([k,n,d])=>{const lv=g.buildings[k],cost=lv===1?20:40;return `<button class="v5-building" data-v5-upgrade="${k}"><strong>LV ${lv}</strong><small>FACILITY</small><b>${n}</b><span>${lv<3?`${d} · upgrade ${cost} iron`:'Maximum prototype level'}</span></button>`}).join('')}<button class="v5-building" data-v5-go="inventory"><strong>${g.inventory.length}</strong><small>STORAGE</small><b>STOREHOUSE</b><span>Recovered weapons and relics</span></button><button class="v5-building locked"><strong>—</strong><small>FUTURE</small><b>GUILD HALL</b><span>Sealed in Prototype 0.1</span></button></div><section class="v5-mission"><small>${o.n===8?'REGIONAL STATUS':`DIRECTIVE ${o.n}/7`}</small><b>${e(o.title)}</b><span>${e(o.body)}</span>${objectiveButton()}</section></section>`,'enclave')}function hstats(h){const gear=Object.values(G().equipped||{}).filter(x=>x?.owner===h.name);let atk=h.atk+(h.lv-1)*3,hp=h.hp+(h.lv-1)*8;for(const x of gear){atk+=x.atk||0;hp+=x.hp||0}if(Game.setCount('Ashen Pilgrim')>=2)atk+=4;if(Game.setCount('Mourning Watch')>=2)hp+=18;return{atk,hp,gear}}function hunters(){const g=G(),h=g.hunters.find(x=>x.name===g.selectedHunter)||g.hunters[0],s=hstats(h);return shell(`<section class="v5-screen v5-hunters"><div class="v5-hall-bg"></div><div class="v5-screenhead"><small>ENCLAVE PERSONNEL</small><b>HUNTER HALL</b></div><nav class="v5-roster">${g.hunters.map(x=>`<button data-v5-hunter="${e(x.name)}" class="${x.name===h.name?'active':''}" style="--art:url('${ART[x.name]}')"><b>${e(x.name)}</b><small>${e(x.role)} · LV ${x.lv}</small></button>`).join('')}</nav><div class="v5-hero" style="--hero:url('${ART[h.name]}')"></div><aside class="v5-gear">${['Weapon','Head','Armor','Charm'].map(slot=>{const it=g.equipped[`${h.name}:${slot}`];return `<button data-v5-go="inventory"><i>${ICON[slot]}</i><b>${it?e(it.name):slot.toUpperCase()}</b><small>${it?`+${it.atk||0} ATK${it.hp?` · +${it.hp} HP`:''}`:'OPEN LOADOUT'}</small></button>`}).join('')}</aside><section class="v5-nameplate"><small>${e(h.role).toUpperCase()} // ACTIVE HUNTER</small><h1>${e(h.name).toUpperCase()}</h1><p>${CREED[h.name]}</p></section><section class="v5-dossier"><div class="v5-stat"><small>LEVEL</small><b>${h.lv}</b><span>XP ${h.xp||0}/${h.lv*48}</span></div><div class="v5-stat"><small>VITALITY</small><b>${s.hp}</b><span>MAX HP</span></div><div class="v5-stat"><small>STRIKE</small><b>${s.atk}</b><span>ATTACK</span></div><div class="v5-stat"><small>LOADOUT</small><b>${s.gear.length}/4</b><span>${Game.setCount('Ashen Pilgrim')>=2?'ASHEN PILGRIM ACTIVE':Game.setCount('Mourning Watch')>=2?'MOURNING WATCH ACTIVE':'NO SET BONUS'}</span></div></section></section>`,'hunters')}function map(){const g=G(),o=Game.objective();return shell(`<section class="v5-screen v5-map"><div class="v5-map-grid"></div><div class="v5-screenhead"><small>SCOUT CARTOGRAPHY // TOWER LV ${g.buildings.tower}</small><b>ASHEN MARCHES</b></div><div class="v5-route"></div><div class="v5-nodes">${R.map((r,i)=>{const open=Game.regionOpen(i),clear=g.clears[i];return `<button data-v5-region="${i}" class="v5-node${i} ${open?'':'closed'} ${clear?'cleared':''}" ${open?'':'disabled'}><i>${clear?'✓':i===0?'⌂':i===1?'╫':i===2?'†':'♜'}</i><b>${open?RA[i]:'UNKNOWN'}</b><span>${clear?`${clear} CLEAR${clear>1?'S':''}`:open?'OPEN':'FOG'}</span></button>`}).join('')}</div><section class="v5-intel"><small>CURRENT DIRECTIVE</small><b>${e(o.title)}</b><span>${e(o.body)}</span></section></section>`,'map')}function inventory(){const g=G(),h=g.selectedHunter;const items=[...g.inventory].sort((a,b)=>(b.owner===h)-(a.owner===h)||({common:0,uncommon:1,rare:2,relic:3}[b.rarity]-({common:0,uncommon:1,rare:2,relic:3}[a.rarity])));return shell(`<section class="v5-screen v5-loot"><header class="v5-loot-head"><small>STOREHOUSE // COMPARE FOR ${e(h).toUpperCase()}</small><b>RECOVERED EQUIPMENT</b><span>${g.inventory.length} items · ${Object.keys(g.equipped||{}).length} equipped · Forge uses 14 Iron + 8 Salvage</span></header><div class="v5-hunter-tabs">${g.hunters.map(x=>`<button data-v5-hunter="${e(x.name)}" class="${x.name===h?'active':''}">${e(x.name)}</button>`).join('')}</div><section class="v5-loot-list">${items.length?items.map(i=>`<article class="v5-item"><div class="v5-item-icon">${ICON[i.slot]||'◆'}</div><div><small>${e(i.rarity).toUpperCase()} · ${e(i.slot)}${i.set?` · ${e(i.set)}`:''}</small><b>${e(i.name)}</b><span>${e(i.affix||'Recovered')} · +${i.atk||0} ATK${i.hp?` · +${i.hp} HP`:''}${i.owner?` · ${e(i.owner)}`:''}</span></div><div class="v5-item-actions"><button data-v5-equip="${i.id}" data-owner="${e(h)}">${i.owner===h?'EQUIPPED':`EQUIP`}</button><button data-v5-salvage="${i.id}" ${i.owner?'disabled':''}>SALVAGE</button></div></article>`).join(''):`<div class="v5-empty">The storehouse is empty. Enter the Marches and recover equipment.</div>`}</section></section>`,'inventory')}function captureEvent(){return{title:root.querySelector('.eventcopy h1')?.textContent||'FIELD DISCOVERY',text:root.querySelector('.eventcopy p')?.textContent||'Something waits in the ash.',risk:root.querySelector('[data-event="risk"]')?.textContent||'TAKE THE RISK',safe:root.querySelector('[data-event="safe"]')?.textContent||'LEAVE IT'}}function event(){const x=captureEvent();return shell(`<section class="v5-screen v5-event"><div class="v5-event-art"></div><section class="v5-story"><small>FIELD DISCOVERY // ASHEN MARCHES</small><h1>${e(x.title)}</h1><p>${e(x.text)}</p><div class="v5-story-actions"><button class="primary" data-v5-event="risk">${e(x.risk)}</button><button data-v5-event="safe">${e(x.safe)}</button></div></section></section>`,'event')}function result(){const g=G(),x=g.lastResult;if(!x)return map();return shell(`<section class="v5-screen v5-result"><div class="v5-result-art"></div><section class="v5-story"><small>${x.boss?'REGIONAL THREAT BROKEN':'EXPEDITION VICTORY'}</small><h1>${x.boss?'THE BELL FALLS SILENT':e(R[x.region])+' CLEARED'}</h1><div class="v5-rewards"><span>◈ +${x.reward.coin}</span><span>⚒ +${x.reward.iron}</span><span>⌁ +${x.reward.salvage}</span></div><p>${g.lastDrops.length} recovered item${g.lastDrops.length===1?'':'s'} are waiting in the Storehouse.</p><div class="v5-story-actions"><button class="primary" data-v5-secure>SECURE THE RECOVERY</button></div></section></section>`,'result')}function battle(){const g=G(),b=B();if(!b)return map();const unit=(u,i,enemy)=>`<button ${enemy?`data-v5-target="${i}"`:''} class="v5-unit ${enemy?'enemy':'ally'} ${u.hp<=0?'down':''} ${enemy&&b.target===i?'target':''}" ${u.hp<=0?'disabled':''}><b>${e(u.name)}</b><small>${u.row.toUpperCase()}</small><div class="v5-hp"><i style="width:${Math.max(0,100*u.hp/u.max)}%"></i></div><small>${Math.max(0,Math.round(u.hp))}/${u.max}</small></button>`;return shell(`<section class="v5-screen v5-battle"><div class="v5-battlefield"><div class="v5-screenhead"><small>CONTACT // ${e(R[b.region]).toUpperCase()}</small><b>FORMATION ENGAGED</b></div><div class="v5-team enemies">${b.enemies.map((u,i)=>unit(u,i,true)).join('')}</div><div class="v5-team allies">${b.party.map((u,i)=>unit(u,i,false)).join('')}</div></div><section class="v5-combat"><div class="v5-combat-head"><div><small>TURN ${b.turn}</small><b>${b.enemies[b.target]?.name||'Select a target'}</b></div><div class="v5-resolve">RESOLVE ${Math.floor(b.resolve)}/100</div></div><div class="v5-abilities"><button data-v5-ability="focus" ${b.resolve<30?'disabled':''}><b>⌖ FOCUS</b><small>30</small></button><button data-v5-ability="sever" ${b.resolve<40?'disabled':''}><b>╱ SEVER</b><small>40</small></button><button data-v5-ability="guard" ${b.resolve<25?'disabled':''}><b>⛨ BRACE</b><small>25</small></button><button data-v5-ability="heal" ${b.resolve<35?'disabled':''}><b>✚ TREAT</b><small>35</small></button></div><div class="v5-target-note">Combat advances automatically. Tap an enemy to change focus.</div></section></section>`,'battle')}function render(){const g=G();if(!g)return;const s=g.screen;const html=s==='title'?title():s==='enclave'?enclave():s==='hunters'?hunters():s==='map'?map():s==='inventory'?inventory():s==='event'?event():s==='battle'?battle():s==='result'?result():enclave();root.innerHTML=html;bind();last=sig()}function bind(){root.querySelectorAll('[data-v5-go]').forEach(b=>b.onclick=()=>Game.go(b.dataset.v5Go));root.querySelector('[data-v5-begin]')?.addEventListener('click',()=>{const g=G();g.started=true;g.screen='enclave';Game.save();Game.render()});root.querySelectorAll('[data-v5-hunter]').forEach(b=>b.onclick=()=>{const g=G();g.selectedHunter=b.dataset.v5Hunter;Game.save();Game.render()});root.querySelectorAll('[data-v5-upgrade]').forEach(b=>b.onclick=()=>Game.upgrade(b.dataset.v5Upgrade));root.querySelector('[data-v5-objective]')?.addEventListener('click',()=>{const o=Game.objective();if(o.screen)Game.go(o.screen);else if(o.sheet==='hall')Game.upgrade('hall');else if(o.sheet==='forge')Game.craft()});root.querySelectorAll('[data-v5-region]').forEach(b=>b.onclick=()=>Game.depart(+b.dataset.v5Region));root.querySelectorAll('[data-v5-equip]').forEach(b=>b.onclick=()=>Game.equip(+b.dataset.v5Equip,b.dataset.owner));root.querySelectorAll('[data-v5-salvage]').forEach(b=>b.onclick=()=>Game.salvage(+b.dataset.v5Salvage));root.querySelectorAll('[data-v5-event]').forEach(b=>b.onclick=()=>Game.resolveEvent(b.dataset.v5Event==='risk'));root.querySelectorAll('[data-v5-target]').forEach(b=>b.onclick=()=>{B().target=+b.dataset.v5Target;Game.render()});root.querySelectorAll('[data-v5-ability]').forEach(b=>b.onclick=()=>Game.ability(b.dataset.v5Ability));root.querySelector('[data-v5-secure]')?.addEventListener('click',()=>{const g=G();g.screen='inventory';Game.save();Game.render()})}function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;const has=root.firstElementChild?.classList?.contains('v5-root');const s=sig();if(!has||s!==last)render()})}new MutationObserver(schedule).observe(root,{childList:true,subtree:true});render();})();
</script></body></html>
